name: Java CI with Gradle
# Temporary verification branch; no runtime behavior changes.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build universal JAR
        run: ./gradlew --no-daemon clean universalJar

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ModernTerrainGenerator-1.21.11
          path: build/distributions/*.jar
          if-no-files-found: error
          retention-days: 14
