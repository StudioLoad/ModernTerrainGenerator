name: ModernTerrainGenerator
version: ${version}
description: 'A Paper Lobby based in Core and Arcade.'
authors: ['Rodriaum']
main: com.rodriaum.mtg.paper.MTGPlugin
load: STARTUP
softdepend: ['WorldEdit']
api-version: '1.21'
folia-supported: false
permissions:
  mtg.*:
    default: false
    children:
      mtg.cmd.*: true
      mtg.default: true
  mtg.cmd.*:
    default: false
    children:
      mtg.cmd.biome: true
      mtg.cmd.data: true
      mtg.cmd.edit: true
      mtg.cmd.export: true
      mtg.cmd.flush: true
      mtg.cmd.preset: true
      mtg.cmd.region: true
      mtg.cmd.structure: true
      otg.cmd.help: true
      otg.cmd.map: true
      otg.cmd.spawn: true
      otg.cmd.tp: true
    mtg.cmd.biome:
      default: op
      description: show chunk biome and block stats
    mtg.cmd.data:
      default: op
      description: modifies mtg data
    mtg.cmd.help:
      default: true
      description: show help
    mtg.cmd.edit:
      default: op
      description: allows you to edit presets
    mtg.cmd.map:
      default: op
      description: generate map image, terrain/biome options are available
    mtg.cmd.spawn:
      default: op
      description: spawn bo3 where you look
    mtg.cmd.tp:
      default: op
      description: Teleport to the given biome (name or id, max range 1000 chunks)
    mtg.cmd.flush:
      default: op
      description: Flushes MTG data
    mtg.cmd.export:
      default: op
      description: Exports the current WorldEdit selection as a new BO3.
    mtg.cmd.preset:
      default: true
      description: Shows current preset
    mtg.cmd.region:
      default: op
      description: Configures region for MTG commands
    mtg.cmd.structure:
      default: op
      description: Shows information about a structure
